<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Scraper — Live Dashboard</title>
<meta name="description" content="Live proxy pool dashboard — validated proxies, geo-tagged, real-time.">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--black:#171717;--white:#ffffff;--gray-600:#4d4d4d;--gray-400:#808080;--gray-300:#a3a3a3;
--gray-100:#ebebeb;--gray-50:#fafafa;
--ring:rgba(0,0,0,0.08) 0px 0px 0px 1px;
--card:rgba(0,0,0,0.08) 0px 0px 0px 1px, rgba(0,0,0,0.04) 0px 2px 2px, rgba(0,0,0,0.04) 0px 8px 8px -8px, #fafafa 0px 0px 0px 1px;
--focus:hsla(212,100%,48%,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--white);color:var(--black);-webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}

/* Nav */
nav{position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);box-shadow:rgba(0,0,0,0.08) 0px 0px 0px 1px;z-index:10}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}
.logo{font-weight:600;font-size:16px;letter-spacing:-0.32px}
.logo span{color:var(--gray-400)}
.nav-links{display:flex;gap:24px;align-items:center;font-size:14px;font-weight:500}
.nav-links a{color:var(--gray-600);text-decoration:none}
.nav-links a:hover{color:var(--black)}
.nav-links a.active{color:var(--black);font-weight:600}
.cta{background:var(--black);color:var(--white)!important;padding:8px 16px;border-radius:6px;font-weight:500}
.cta:hover{background:#000;text-decoration:none}

/* Container */
.wrap{max-width:1200px;margin:0 auto;padding:40px 24px 80px}
.page-title{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.page-title h1{font-size:32px;font-weight:600;letter-spacing:-1.28px}
.page-title .sub{font-size:13px;color:var(--gray-400);font-weight:400}
.updated{font-size:13px;color:var(--gray-400);margin-bottom:32px}
.updated span{color:var(--black);font-weight:500}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:40px}
.stat{background:var(--white);box-shadow:var(--card);border-radius:8px;padding:28px 20px;text-align:center;transition:transform .3s ease,box-shadow .3s ease;opacity:0;transform:translateY(16px)}
.stat.in{opacity:1;transform:none}
.stat:hover{transform:translateY(-2px);box-shadow:rgba(0,0,0,0.08) 0px 0px 0px 1px, rgba(0,0,0,0.04) 0px 4px 8px, rgba(0,0,0,0.04) 0px 12px 16px -8px, #fafafa 0px 0px 0px 1px}
.stat .num{font-size:40px;font-weight:600;letter-spacing:-1.6px;line-height:1}
.stat .label{font-size:13px;font-weight:500;color:var(--gray-400);margin-top:10px;letter-spacing:-0.32px}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters input,.filters select{font-family:'Geist',sans-serif;background:var(--white);box-shadow:var(--ring);border:none;color:var(--black);padding:8px 12px;border-radius:6px;font-size:13px;outline:none;transition:box-shadow .2s}
.filters input:focus,.filters select:focus{box-shadow:rgba(0,0,0,0.08) 0px 0px 0px 1px, 0 0 0 2px var(--focus)}
.filters input{width:220px}
.filters label{font-size:13px;font-weight:500;color:var(--gray-400)}
.count-label{font-size:13px;font-weight:500;color:var(--gray-600);margin:0 0 12px}
.count-label span{color:var(--black);font-weight:600}

/* Table */
.table-wrap{box-shadow:var(--card);border-radius:8px;overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#fff;box-shadow:rgba(0,0,0,0.08) 0px 0px 0px 1px;padding:12px 14px;text-align:left;font-weight:500;color:var(--gray-400);font-size:12px;letter-spacing:0.3px;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--black)}
tbody td{padding:10px 14px;border-top:1px solid var(--gray-100);white-space:nowrap}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--gray-50)}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.score-high{color:#0a72ef}
.score-mid{color:#b45309}
.score-low{color:#dc2626}
.badge{display:inline-block;padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:500;font-family:'Geist Mono',monospace}
.badge-http{background:#ebf5ff;color:#0068d6}
.badge-socks5{background:#f3ebff;color:#7c3aed}
.badge-socks4{background:#fdf2f8;color:#db2777}
.badge-elite{background:#ecfdf5;color:#059669}
.badge-anonymous{background:#fffbeb;color:#d97706}
.badge-transparent{background:#fef2f2;color:#dc2626}
.country-tag{display:inline-block;background:var(--gray-50);box-shadow:var(--ring);border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;font-family:'Geist Mono',monospace;margin-right:4px}
.isp{color:var(--gray-400);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.empty{padding:48px;text-align:center;color:var(--gray-400);font-size:14px}

/* Footer */
footer{border-top:1px solid var(--gray-100);padding:24px;text-align:center}
footer .mono{font-size:12px;color:var(--gray-400)}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}

@media(max-width:768px){
.wrap{padding:24px 16px 48px}
.page-title h1{font-size:24px;letter-spacing:-0.96px}
.stats{grid-template-columns:repeat(2,1fr);gap:12px}
.stat .num{font-size:28px}
.filters input{width:100%}
.nav-links a:not(.cta){display:none}
}
</style>
</head>
<body>
<nav>
<div class="nav-inner">
<div class="logo">Proxy<span>Scraper</span></div>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="#" class="active">Dashboard</a>
<a class="cta" href="https://github.com/Shinzzyak/proxy-scraper">View Repository</a>
</div>
</div>
</nav>

<div class="wrap">
<div class="page-title">
<h1>Live Dashboard</h1>
<span class="sub mono">PROXY POOL · REAL-TIME</span>
</div>
<p class="updated">Last updated: <span id="lastUpdate">loading...</span></p>

<div class="stats" id="statsGrid"></div>

<div class="filters">
<input type="text" id="searchIP" placeholder="Search IP...">
<select id="filterProtocol"><option value="">All Protocols</option><option value="http">HTTP</option><option value="socks5">SOCKS5</option><option value="socks4">SOCKS4</option></select>
<select id="filterCountry"><option value="">All Countries</option></select>
<select id="filterAnonymity"><option value="">All Anonymity</option><option value="elite">Elite</option><option value="anonymous">Anonymous</option><option value="transparent">Transparent</option></select>
<select id="sortBy"><option value="score">Sort: Score</option><option value="speed">Sort: Speed</option><option value="country">Sort: Country</option></select>
</div>

<p class="count-label">Showing <span id="proxyCount">0</span> proxies</p>

<div class="table-wrap">
<table>
<thead><tr><th>Score</th><th>IP</th><th>Port</th><th>Protocol</th><th>Speed</th><th>Anonymity</th><th>Country</th><th>City</th><th>ISP</th><th>Last Seen</th></tr></thead>
<tbody id="proxyTable"></tbody>
</table>
</div>
</div>

<footer><span class="mono">PROXY-SCRAPER · AUTO-UPDATED EVERY 2H · GITHUB ACTIONS</span></footer>

<script>
function countUp(el,target,dur=1000){
  const t0=performance.now();
  function tick(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(target*e).toLocaleString();
    if(p<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});

async function load(){
const r=await fetch('proxies.json');
const proxies=await r.json();
document.getElementById('lastUpdate').textContent=proxies.length?proxies[0].last_seen:'N/A';

// Stats
const protocols={},anonymities={},countries={};
let totalSpeed=0;
proxies.forEach(p=>{
protocols[p.protocol]=(protocols[p.protocol]||0)+1;
anonymities[p.anonymity]=(anonymities[p.anonymity]||0)+1;
if(p.country_code)countries[p.country_code]=(countries[p.country_code]||0)+1;
totalSpeed+=p.response_time_ms||0;
});
const avgSpeed=Math.round(totalSpeed/proxies.length);
const grid=document.getElementById('statsGrid');
const statCards=[
{num:proxies.length,label:'Total Proxies'},
{num:Object.keys(countries).length,label:'Countries'},
{num:avgSpeed,label:'Avg Response (ms)'},
...Object.entries(protocols).map(([k,v])=>({num:v,label:k.toUpperCase()}))
];
grid.innerHTML=statCards.map((s,i)=>`<div class="stat" style="transition-delay:${i*60}ms"><div class="num" data-count="${s.num}">0</div><div class="label">${s.label}</div></div>`).join('');
grid.querySelectorAll('.stat').forEach(el=>io.observe(el));
grid.querySelectorAll('.num[data-count]').forEach(el=>countUp(el,+el.dataset.count));

// Country filter
const cs=document.getElementById('filterCountry');
Object.keys(countries).sort().forEach(c=>{
const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);
});

render(proxies);
document.getElementById('searchIP').oninput=()=>render(proxies);
document.getElementById('filterProtocol').onchange=()=>render(proxies);
document.getElementById('filterCountry').onchange=()=>render(proxies);
document.getElementById('filterAnonymity').onchange=()=>render(proxies);
document.getElementById('sortBy').onchange=()=>render(proxies);
}

function render(proxies){
const q=document.getElementById('searchIP').value.toLowerCase();
const fp=document.getElementById('filterProtocol').value;
const fc=document.getElementById('filterCountry').value;
const fa=document.getElementById('filterAnonymity').value;
const sb=document.getElementById('sortBy').value;
let f=proxies.filter(p=>{
if(q&&!p.ip.includes(q))return false;
if(fp&&p.protocol!==fp)return false;
if(fc&&p.country_code!==fc)return false;
if(fa&&p.anonymity!==fa)return false;
return true;
});
f.sort((a,b)=>{
if(sb==='score')return(b.score||0)-(a.score||0);
if(sb==='speed')return(a.response_time_ms||9999)-(b.response_time_ms||9999);
if(sb==='country')return(a.country_code||'ZZ').localeCompare(b.country_code||'ZZ');
return 0;
});
document.getElementById('proxyCount').textContent=f.length;
const tb=document.getElementById('proxyTable');
tb.innerHTML=f.slice(0,500).map(p=>`<tr>
<td class="score ${p.score>=70?'score-high':p.score>=40?'score-mid':'score-low'}">${p.score||0}</td>
<td>${p.ip}</td><td>${p.port}</td>
<td><span class="badge badge-${p.protocol}">${p.protocol}</span></td>
<td>${p.response_time_ms}ms</td>
<td><span class="badge badge-${p.anonymity}">${p.anonymity}</span></td>
<td><span class="country-tag">${p.country_code||'??'}</span>${p.country||''}</td>
<td>${p.city||''}</td>
<td class="isp" title="${p.isp||''}">${p.isp||''}</td>
<td>${p.last_seen||''}</td></tr>`).join('') || '<tr><td colspan="10" class="empty">No proxies match your filters</td></tr>';
}
load();
</script>
</body>
</html>
